<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shell" cx="38%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ffa3b4"/>
      <stop offset="42%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#8f0a26"/>
    </radialGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- legs -->
  <g stroke="#7df9ff" stroke-width="1.5" stroke-linecap="round" opacity="0.95">
    <path d="M7.6 17.2 L2.8 14.6" />
    <path d="M7.2 20.8 L2.0 22.2" />
    <path d="M8.2 24.4 L4.2 28.0" />
    <path d="M24.4 17.2 L29.2 14.6" />
    <path d="M24.8 20.8 L30.0 22.2" />
    <path d="M23.8 24.4 L27.8 28.0" />
  </g>

  <!-- antennae -->
  <g stroke="#7df9ff" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M13.6 8.4 C11.6 5.4 9.4 4.6 7.4 5.1" />
    <path d="M18.4 8.4 C20.4 5.4 22.6 4.6 24.6 5.1" />
  </g>
  <circle cx="7.1" cy="4.9" r="1.5" fill="#7df9ff" />
  <circle cx="24.9" cy="4.9" r="1.5" fill="#7df9ff" />

  <!-- head -->
  <path d="M16 4.4a5.9 5.9 0 0 0-5.9 5.9h11.8A5.9 5.9 0 0 0 16 4.4z" fill="#0b0d16" stroke="#7df9ff" stroke-width="1.1" />

  <!-- shell -->
  <ellipse cx="16" cy="19.4" rx="9.3" ry="10.1" fill="url(#shell)" stroke="#7df9ff" stroke-width="1.3" filter="url(#neon)" />
  <path d="M16 9.6v19.6" stroke="#0b0d16" stroke-width="1.3" stroke-linecap="round" />

  <!-- spots -->
  <g fill="#0b0d16">
    <circle cx="12.1" cy="16.0" r="2.0" />
    <circle cx="19.9" cy="16.0" r="2.0" />
    <circle cx="12.7" cy="22.3" r="2.1" />
    <circle cx="19.3" cy="22.3" r="2.1" />
    <circle cx="16" cy="26.6" r="1.7" />
  </g>
</svg>
